  .hright{display:flex;align-items:center;gap:16px}
  .tema{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:transparent;color:var(--alt);display:grid;place-items:center;transition:border-color .15s,color .15s}

  :root[data-theme=light] .tema .luna{display:none}

  ]},
  { b:'Confirmación', qs:[
    { row:[ { k:'completa_nombre', label:'Tu nombre y apellido', type:'text', core:true }, { k:'completa_cargo', label:'Tu cargo', type:'text', core:true } ] },
    { k:'acepta', label:'Términos y datos personales', type:'check', core:true,
      text:'Acepto los términos y condiciones de ABN y el tratamiento de mis datos personales conforme a la Ley 25.326 (Argentina) y la normativa aplicable en mi país.' },
  ]},
];
const BLOCK_DESC = {
  'Empresa':'Quiénes son', 'Datos fiscales':'Para facturar bien', 'Contactos':'Con quién hablamos', 'Facturación':'Cómo y cuándo pagan',
  'Documentación':'Constancias y papeles', 'Servicio':'Qué hacemos juntos', 'Confirmación':'Último paso',
};

/* ---------- Estado ---------- */
const params = new URLSearchParams(location.search);
const EMPRESA = (params.get('empresa') || params.get('nombre') || '').trim().slice(0, 80);
const KEY = 'abn-alta-cliente:' + EMPRESA;
let S = { v:{}, i:-1 };
let REVIEW = false;
const FILES = {};
try { const saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved && saved.v) S = { v:saved.v, i:saved.i ?? -1 }; } catch(e) {}
if (EMPRESA && !S.v.nombre_fantasia) S.v.nombre_fantasia = EMPRESA;
const hadProgress = S.i >= 0;
let mode = 'intro';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };

const $ = s => document.querySelector(s);
const view = $('#view'), bar = $('#bar');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LET = 'ABCDEFGHIJKLMNOP';

if (EMPRESA) { $('#client').textContent = EMPRESA; $('#x').hidden = false; document.title = 'Alta de cliente · ' + EMPRESA + ' · ABN Group'; }

const flat = qs => qs.flatMap(q => q.row ? q.row : [q]);
const visScreens = () => SCREENS.filter(s => !s.show || s.show(S.v));
const qVis = q => !q.show || q.show(S.v);
const visQs = s => flat(s.qs).filter(qVis);
const filled = q => {
  if (q.type === 'file') return (FILES[q.k] || []).length > 0;
  const x = S.v[q.k]; return Array.isArray(x) ? x.length > 0 : !!(x && String(x).trim());
};
const blocks = () => [...new Set(visScreens().map(s => s.b))];

/* ---------- Render ---------- */
function ctlHTML(q, id) {
  const val = S.v[q.k];
  const ph = q.ph ? ' placeholder="' + esc(q.ph) + '"' : '';
  switch (q.type) {
    case 'textarea': return '<textarea class="field" id="' + id + '" data-k="' + q.k + '"' + ph + '>' + esc(val) + '</textarea>';
    case 'select': return '<select class="field" id="' + id + '" data-k="' + q.k + '"><option value="">Elegí una opción…</option>' +
      q.opts.map(o => '<option' + (val === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
    case 'opt': return '<div class="opts" role="radiogroup">' + q.opts.map((o, j) =>
      '<label class="opt' + (val === o ? ' on' : '') + '"><input type="radio" name="' + q.k + '" data-k="' + q.k + '" value="' + esc(o) + '"' + (val === o ? ' checked' : '') + '>' +
      '<span class="k">' + LET[j] + '</span><span>' + esc(o) + '</span></label>').join('') + '</div>';
    case 'pills': case 'multi': {
      const multi = q.type === 'multi', arr = Array.isArray(val) ? val : [];
      return '<div class="pills"' + (multi ? '' : ' role="radiogroup"') + '>' + q.opts.map((o, j) => {
        const on = multi ? arr.includes(o) : val === o;
        return '<label class="pill' + (on ? ' on' : '') + '"><input type="' + (multi ? 'checkbox' : 'radio') + '" name="' + q.k + '" data-k="' + q.k + '" value="' + esc(o) + '"' + (on ? ' checked' : '') + '>' +
          '<span class="k">' + (multi && on ? '✓' : LET[j]) + '</span>' + esc(o) + '</label>';
      }).join('') + '</div>';
    }
    case 'check': return '<label class="opt' + (val === 'Sí' ? ' on' : '') + '"><input type="checkbox" data-k="' + q.k + '"' + (val === 'Sí' ? ' checked' : '') + '>' +
      '<span class="k">✓</span><span>' + esc(q.text) + '</span></label>';
    case 'file': {
      const names = (FILES[q.k] || []).map(f => f.name).join(' · ');
      return '<input type="file" class="field" id="' + id + '" data-k="' + q.k + '" multiple accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/*">' +
        '<p class="files">' + esc(names) + '</p>';
    }
    default: return '<input class="field" id="' + id + '" data-k="' + q.k + '" type="' + q.type + '"' + (q.multiple ? ' multiple' : '') +
      ' value="' + esc(val) + '"' + ph + ' autocomplete="off">';
  }
}
let uid = 0;
function qHTML(q) {
  const id = 'q' + (++uid);
  const grupo = ['opt','pills','multi','check'].includes(q.type);
  const opc = (q.core || q.req) ? '' : '<span class="opc">Opcional</span>';
  return '<div class="q" data-q="' + q.k + '" data-u="' + uid + '"' + (qVis(q) ? '' : ' hidden') + '>' +
    '<h2>' + (grupo ? esc(q.label) : '<label for="' + id + '">' + esc(q.label) + '</label>') + opc + '</h2>' +
    (q.help ? '<p class="help">' + esc(q.help) + '</p>' : '') +
    '<div class="ctl">' + ctlHTML(q, id) + '</div><p class="ferr" hidden></p></div>';
}
const foot = (backLabel, primary) =>
  '<div class="foot">' + (backLabel ? '<button class="ghost" id="back" type="button">← ' + backLabel + '</button>' : '') +
  '<div class="right"><span class="hint">Enter ↵</span>' + primary + '</div></div>';

let QMAP = []; // [{el, q}] de la pantalla actual
function render() {
  const vs = visScreens();
  if (S.i >= vs.length) S.i = vs.length - 1;
  view.style.animation = 'none'; void view.offsetWidth; view.style.animation = '';
  QMAP = [];
  if (mode === 'intro') {
    bar.style.width = '0%';
    view.className = 'card intro';
    view.innerHTML = '<p class="eyebrow">Alta de cliente</p>' +
      '<h1>' + (EMPRESA ? 'Damos de alta a <b>' + esc(EMPRESA) + '</b>.' : 'Bienvenidos a <b>ABN Group</b>.') + '</h1>' +
      '<p class="lead">Con estos datos te damos de alta como cliente y podemos facturarte. Casi todo se responde con un toque, ' +
      'y podés <b>omitir</b> lo que no tengas a mano: te lo pedimos más adelante.</p>' +
      '<div class="chips"><span>' + blocks().length + ' secciones</span><span>Unos 5 minutos</span><span>Se guarda en este navegador</span></div>' +
      '<div style="flex:1"></div>' +
      foot(hadProgress ? 'Empezar de nuevo' : '', '<button class="primary" id="next" type="button">' + (hadProgress ? 'Continuar' : 'Empezar') + '</button>');
  } else if (mode === 'review') {
    bar.style.width = '100%';
    view.className = 'card';
    let h = '<p class="eyebrow">Repaso</p><div class="qbody"><h2 class="rtitle">Revisá antes de enviar</h2>' +
      '<p class="rlead">Podés corregir cualquier respuesta. Lo que quedó sin responder te lo pedimos después.</p>';
    blocks().forEach(b => {
      h += '<div class="rsec"><h3>' + esc(b) + '</h3>';
      vs.forEach((s, idx) => { if (s.b !== b) return; visQs(s).forEach(q => {
        let a = q.type === 'file' ? (FILES[q.k] || []).map(f => f.name).join(', ') : S.v[q.k];
        if (Array.isArray(a)) a = a.join(', ');
        if (q.type === 'check') a = a === 'Sí' ? 'Aceptado' : '';
        h += '<div class="rrow"><div><p class="rq">' + esc(q.label) + '</p><p class="ra' + (a ? '' : ' none') + '">' + (a ? esc(a) : 'Sin responder') + '</p></div>' +
          '<button class="edit" type="button" data-go="' + idx + '">Editar</button></div>';
      }); });
      h += '</div>';
    });
    h += '</div><p class="err" id="sendErr" hidden></p>';
    view.innerHTML = h + foot('Atrás', '<button class="primary" id="next" type="button">Enviar</button>');
  } else if (mode === 'done') {
    bar.style.width = '100%';
    view.className = 'card done';
    view.innerHTML = '<div class="ok">✓</div><h2>¡Listo, gracias!</h2><p>Recibimos tus datos. Nuestro equipo de administración los revisa y te escribe si falta algo.</p>';
  } else {
    const s = vs[S.i];
    bar.style.width = Math.round(S.i / vs.length * 100) + '%';
    view.className = 'card';
    let body = (s.title ? '<h2 class="rtitle">' + esc(s.title) + '</h2>' : '') + (s.note ? '<p class="note">' + esc(s.note) + '</p>' : '');
    const start = uid;
    s.qs.forEach(q => { body += q.row ? '<div class="grid2">' + q.row.map(qHTML).join('') + '</div>' : qHTML(q); });
    view.innerHTML = '<div class="qhead"><span class="b">' + esc(s.b) + '</span><span class="n">' + (S.i + 1) + ' / ' + vs.length + '</span></div>' +
      '<div class="qbody">' + body + '</div>' +
      foot('Atrás', '<button class="primary" id="next" type="button"></button>');
    const qs = flat(s.qs);
    view.querySelectorAll('.q[data-u]').forEach((el, j) => QMAP.push({ el, q: qs[j] }));
    updatePrimary();
    const first = view.querySelector('.q:not([hidden]) .field');
    if (first && window.matchMedia('(min-width: 861px)').matches) first.focus({ preventScroll:true });
  }
  renderMap();
}
function updatePrimary() {
  const btn = $('#next'); if (!btn || mode !== 'screen') return;
  const qs = visQs(visScreens()[S.i]);
  const skip = !qs.some(filled) && !qs.some(q => q.core);
  btn.classList.toggle('skip', skip);
  btn.textContent = REVIEW ? 'Volver al repaso' : (skip ? 'Omitir' : 'Siguiente');
}
function renderMap() {
  const vs = visScreens(), cur = mode === 'screen' ? vs[S.i].b : null;
  $('#map').innerHTML = blocks().map(b => {
    const qs = vs.filter(s => s.b === b).flatMap(visQs);
    const n = qs.filter(filled).length;
    return '<li class="' + (b === cur ? 'on ' : '') + (n === qs.length ? 'full' : '') + '"><button type="button" data-block="' + esc(b) + '"' + (mode === 'intro' || mode === 'done' ? ' disabled' : '') + '>' +
      '<span class="lbl">' + esc(b) + '</span><span class="cnt">' + n + '/' + qs.length + '</span></button><p>' + esc(BLOCK_DESC[b] || '') + '</p></li>';
  }).join('');
}

/* ---------- Validación ---------- */
const reEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function validate() {
  let ok = true;
  QMAP.forEach(({ el, q }) => {
    if (el.hidden) return;
    const box = el.querySelector('.ferr');
    let msg = '';
    const v = S.v[q.k];
    if (q.core && !filled(q)) msg = q.type === 'check' ? 'Necesitamos que lo aceptes para continuar.' : 'Necesitamos este dato para darte de alta.';
    else if (q.type === 'email' && v && !String(v).split(/[,;]\s*/).filter(Boolean).every(e => reEmail.test(e.trim()))) msg = 'Revisá el formato del email.';
    else if (q.fmt === 'cuit' && v && !/^\d{2}-?\d{8}-?\d$/.test(String(v).trim())) msg = 'El CUIT tiene 11 dígitos. Ej.: 30-12345678-9.';
    else if (q.type === 'file' && (FILES[q.k] || []).some(f => f.size > MAX_MB_POR_ARCHIVO * 1048576)) msg = 'Cada archivo puede pesar hasta ' + MAX_MB_POR_ARCHIVO + ' MB.';
    box.textContent = msg; box.hidden = !msg;
    if (msg && ok) { ok = false; el.scrollIntoView({ behavior:'smooth', block:'center' }); }
  });
  return ok;
}

/* ---------- Navegación ---------- */
function go(i) { mode = 'screen'; S.i = i; save(); render(); }
function next() {
  if (mode === 'intro') return go(hadProgress ? S.i : 0);
  if (mode === 'review') return send();
  if (!validate()) return;
  if (REVIEW || S.i >= visScreens().length - 1) { REVIEW = false; mode = 'review'; save(); return render(); }
  go(S.i + 1);
}
function back() {
  if (mode === 'intro') { // "Empezar de nuevo"
    try { localStorage.removeItem(KEY); } catch(e) {}
    S = { v: EMPRESA ? { nombre_fantasia:EMPRESA } : {}, i:-1 }; return go(0);
  }
  if (mode === 'review') return go(visScreens().length - 1);
  REVIEW = false;
  if (S.i === 0) { mode = 'intro'; return render(); }
  go(S.i - 1);
}

/* ---------- Eventos ---------- */
function onChange(e) {
  const el = e.target, k = el.dataset && el.dataset.k; if (!k) return;
  if (el.type === 'file') {
    FILES[k] = [...el.files];
    el.parentElement.querySelector('.files').textContent = FILES[k].map(f => f.name).join(' · ');
  } else if (el.type === 'radio') {
    S.v[k] = el.value;
    view.querySelectorAll('input[name="' + k + '"]').forEach(r => r.closest('label').classList.toggle('on', r.checked));
  } else if (el.type === 'checkbox' && el.name) {
    S.v[k] = [...view.querySelectorAll('input[name="' + k + '"]:checked')].map(c => c.value);
    view.querySelectorAll('input[name="' + k + '"]').forEach((c, j) => {
      const lab = c.closest('label'); lab.classList.toggle('on', c.checked); lab.querySelector('.k').textContent = c.checked ? '✓' : LET[j];
    });
  } else if (el.type === 'checkbox') {
    S.v[k] = el.checked ? 'Sí' : ''; el.closest('label').classList.toggle('on', el.checked);
  } else S.v[k] = el.value;
  const qel = el.closest('.q'); if (qel && e.type === 'change') qel.querySelector('.ferr').hidden = true;
  QMAP.forEach(({ el:div, q }) => { div.hidden = !qVis(q); }); // preguntas que dependen de otra respuesta
  save(); updatePrimary(); renderMap();
}
view.addEventListener('input', onChange);
view.addEventListener('change', onChange);
view.addEventListener('click', e => {
  if (e.target.closest('#next')) next();
  else if (e.target.closest('#back')) back();
  else if (e.target.closest('[data-go]')) { REVIEW = true; mode = 'screen'; S.i = +e.target.closest('[data-go]').dataset.go; render(); }
});
$('#map').addEventListener('click', e => {
  const b = e.target.closest('[data-block]'); if (!b || b.disabled) return;
  const idx = visScreens().findIndex(s => s.b === b.dataset.block); if (idx >= 0) { REVIEW = false; go(idx); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  const t = e.target;
  if (t.tagName === 'TEXTAREA' || (t.tagName === 'BUTTON' && t.id !== 'next') || mode === 'done' || mode === 'review') return;
  e.preventDefault(); next();
});
$('#tema').addEventListener('click', () => {
  const nt = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = nt;
  try { localStorage.setItem('abn-alta-tema', nt); } catch(e) {}
});

/* ---------- Envío ---------- */
const fileToB64 = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
async function send() {
  const btn = $('#next'), err = $('#sendErr');
  const vs = visScreens(), fields = {};
  const qs = vs.flatMap(visQs);
  qs.forEach(q => { if (q.type !== 'file') fields[q.k] = filled(q) ? S.v[q.k] : (q.req ? 'No informado' : ''); });
  fields.website_hp = $('#website_hp').value;
  const files = []; let total = 0;
  for (const k of new Set(qs.filter(q => q.type === 'file').map(q => q.k)))
    for (const f of (FILES[k] || [])) { total += f.size; files.push({ campo:k, nombre:f.name, tipo:f.type, base64: await fileToB64(f) }); }
  if (total > MAX_MB_TOTAL * 1048576) { err.textContent = 'Los adjuntos superan ' + MAX_MB_TOTAL + ' MB en total. Sacá alguno y mandalo por mail a ' + MAIL_DOCUMENTACION + '.'; err.hidden = false; return; }
  btn.disabled = true; btn.textContent = 'Enviando…'; err.hidden = true;
  try {
    const r = await fetch(WEB_APP_URL, { method:'POST', body: JSON.stringify({ fields, files }) });
    const out = await r.json();
    if (!out.ok) throw new Error(out.error || 'Error');
    try { localStorage.removeItem(KEY); } catch(e) {}
    mode = 'done'; render();
  } catch (e) {
    console.error(e);
    err.textContent = 'No pudimos enviar el formulario. Probá de nuevo en unos minutos o escribinos a ' + MAIL_DOCUMENTACION + '.';
    err.hidden = false; btn.disabled = false; btn.textContent = 'Enviar';
  }
}

render();
</script>
</body>
</html>
